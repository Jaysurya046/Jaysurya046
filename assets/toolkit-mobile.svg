<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1837" viewBox="0 0 600 1837" role="img" aria-labelledby="title desc">
<title id="title">Toolkit — From interface to infrastructure</title><desc id="desc">Languages: Python, TypeScript, JavaScript, Java, C++, C. Frontend: React, Next.js, HTML/CSS, Tailwind CSS, Bootstrap. Backend: Node.js, Express, Fastify, Django, REST APIs, Socket.io. Data &amp; storage: PostgreSQL, MySQL, MongoDB, DynamoDB, Redis. Cloud &amp; tools: AWS, Lambda, API Gateway, S3, Docker, Git. AI &amp; automation: Gemini API, Playwright, LLM tooling. Data analysis &amp; ML: Pandas, NumPy, scikit-learn.</desc>
