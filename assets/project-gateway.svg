<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
<title id="title">API Gateway</title><desc id="desc">API Gateway: JWT and API-key authentication, Redis-backed rate limiting, service proxying and Prometheus metrics. Fastify, TypeScript and Redis. Diagram shows the request lifecycle through authentication and rate limiting to services.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#132537"/><stop offset="1" stop-color="#0B1220"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8BB9FF" stroke-opacity=".045"/></pattern></defs>
<rect width="1200" height="350" rx="20" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="348" rx="19" fill="url(#grid)" stroke="#263A4C"/>
<text x="40" y="45" font-family="Consolas, monospace" font-size="15" font-weight="500" fill="#8BB9FF" letter-spacing="1.8">02 / BACKEND / INFRASTRUCTURE</text><text x="40" y="109" font-family="Segoe UI, Arial, sans-serif" font-size="43" font-weight="650" fill="#EDF5FA" letter-spacing="-1">API Gateway</text><text x="40" y="157" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#B4C5D4" >One entry point for backend services.</text><text x="40" y="188" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#B4C5D4" >Authentication, rate limiting and observability.</text><rect x="40" y="246" width="94" height="32" rx="7" fill="#152B35" stroke="#2C4B51"/><text x="52" y="268" font-family="Consolas, monospace" font-size="16" font-weight="500" fill="#8BB9FF" >Fastify</text><rect x="144" y="246" width="124" height="32" rx="7" fill="#152B35" stroke="#2C4B51"/><text x="156" y="268" font-family="Consolas, monospace" font-size="16" font-weight="500" fill="#8BB9FF" >TypeScript</text><rect x="278" y="246" width="74" height="32" rx="7" fill="#152B35" stroke="#2C4B51"/><text x="290" y="268" font-family="Consolas, monospace" font-size="16" font-weight="500" fill="#8BB9FF" >Redis</text><text x="40" y="317" font-family="Consolas, monospace" font-size="14" font-weight="500" fill="#8BB9FF" letter-spacing="1.6">EXPLORE THE REPOSITORY</text><path d="M294 311H320M314 305L320 311L314 317" stroke="#8BB9FF" stroke-width="2" fill="none"/><path d="M710 35L710 309" stroke="#263A4C" fill="none" /><text x="748" y="48" font-family="Consolas, monospace" font-size="14" font-weight="500" fill="#8BB9FF" letter-spacing="1.5">REQUEST LIFECYCLE</text><rect x="748" y="78" width="180" height="48" rx="9" fill="#0E1C2A" stroke="#3C5869"/><text x="838.0" y="107" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#8BB9FF" text-anchor="middle">CLIENT REQUEST</text><path d="M928 102H972" stroke="#8BB9FF" fill="none" /><rect x="972" y="78" width="188" height="48" rx="9" fill="#0E1C2A" stroke="#3C5869"/><text x="1066.0" y="107" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#8BB9FF" text-anchor="middle">JWT / API KEY</text><path d="M1066 126V156H954V177" fill="none" stroke="#8BB9FF" stroke-width="2"/><rect x="849" y="177" width="210" height="48" rx="9" fill="#0E1C2A" stroke="#3C5869"/><text x="954.0" y="206" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#63E6C4" text-anchor="middle">REDIS RATE LIMIT</text><path d="M954 225V251H814V266M954 251V266M954 251H1094V266" fill="none" stroke="#8BB9FF" stroke-width="2"/><rect x="748" y="266" width="132" height="48" rx="9" fill="#0E1C2A" stroke="#3C5869"/><text x="814.0" y="295" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#B4C5D4" text-anchor="middle">TRADE</text><rect x="888" y="266" width="132" height="48" rx="9" fill="#0E1C2A" stroke="#3C5869"/><text x="954.0" y="295" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#B4C5D4" text-anchor="middle">WALLET</text><rect x="1028" y="266" width="132" height="48" rx="9" fill="#0E1C2A" stroke="#3C5869"/><text x="1094.0" y="295" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#B4C5D4" text-anchor="middle">ANALYTICS</text>
