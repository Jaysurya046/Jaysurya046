<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
<title id="title">Online Auction Platform</title><desc id="desc">Online Auction Platform: Django and Node.js with Socket.io, Redis locking and asynchronous bid persistence. Diagram: live bid to validation to queue to Django persistence.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#132537"/><stop offset="1" stop-color="#0B1220"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8BB9FF" stroke-opacity=".045"/></pattern></defs>
<rect width="1200" height="350" rx="20" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="348" rx="19" fill="url(#grid)" stroke="#263A4C"/>
<text x="40" y="45" font-family="Consolas, monospace" font-size="15" font-weight="500" fill="#F4CA83" letter-spacing="1.8">03 / FULL-STACK / REAL-TIME</text><text x="40" y="109" font-family="Segoe UI, Arial, sans-serif" font-size="43" font-weight="650" fill="#EDF5FA" letter-spacing="-1">Online Auction Platform</text><text x="40" y="157" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#B4C5D4" >Live bidding with coordinated state.</text><text x="40" y="188" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#B4C5D4" >Redis locks, event streams and queued writes.</text><rect x="40" y="246" width="84" height="32" rx="7" fill="#152B35" stroke="#2C4B51"/><text x="52" y="268" font-family="Consolas, monospace" font-size="16" font-weight="500" fill="#F4CA83" >Django</text><rect x="134" y="246" width="94" height="32" rx="7" fill="#152B35" stroke="#2C4B51"/><text x="146" y="268" font-family="Consolas, monospace" font-size="16" font-weight="500" fill="#F4CA83" >Node.js</text><rect x="238" y="246" width="114" height="32" rx="7" fill="#152B35" stroke="#2C4B51"/><text x="250" y="268" font-family="Consolas, monospace" font-size="16" font-weight="500" fill="#F4CA83" >Socket.io</text><rect x="362" y="246" width="74" height="32" rx="7" fill="#152B35" stroke="#2C4B51"/><text x="374" y="268" font-family="Consolas, monospace" font-size="16" font-weight="500" fill="#F4CA83" >Redis</text><text x="40" y="317" font-family="Consolas, monospace" font-size="14" font-weight="500" fill="#F4CA83" letter-spacing="1.6">EXPLORE THE REPOSITORY</text><path d="M294 311H320M314 305L320 311L314 317" stroke="#F4CA83" stroke-width="2" fill="none"/><path d="M710 35L710 309" stroke="#263A4C" fill="none" /><text x="748" y="48" font-family="Consolas, monospace" font-size="14" font-weight="500" fill="#F4CA83" letter-spacing="1.5">BID PROCESSING</text><rect x="748" y="79" width="180" height="64" rx="9" fill="#0E1C2A" stroke="#3C5869"/><text x="838.0" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#F4CA83" text-anchor="middle">LIVE BID</text><text x="838.0" y="128" font-family="Consolas, monospace" font-size="13" font-weight="400" fill="#B4C5D4" text-anchor="middle">Socket.io</text><rect x="980" y="79" width="180" height="64" rx="9" fill="#0E1C2A" stroke="#3C5869"/><text x="1070.0" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#63E6C4" text-anchor="middle">VALIDATE</text><text x="1070.0" y="128" font-family="Consolas, monospace" font-size="13" font-weight="400" fill="#B4C5D4" text-anchor="middle">Redis lock</text><path d="M928 111H980" stroke="#F4CA83" fill="none" /><path d="M1070 143V187" stroke="#F4CA83" fill="none" stroke-width="2"/><rect x="980" y="187" width="180" height="64" rx="9" fill="#0E1C2A" stroke="#3C5869"/><text x="1070.0" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#F4CA83" text-anchor="middle">QUEUE</text><text x="1070.0" y="236" font-family="Consolas, monospace" font-size="13" font-weight="400" fill="#B4C5D4" text-anchor="middle">Redis list</text><rect x="748" y="187" width="180" height="64" rx="9" fill="#0E1C2A" stroke="#3C5869"/><text x="838.0" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#8BB9FF" text-anchor="middle">PERSIST</text><text x="838.0" y="236" font-family="Consolas, monospace" font-size="13" font-weight="400" fill="#B4C5D4" text-anchor="middle">Django worker</text><path d="M928 219H980" stroke="#F4CA83" fill="none" /><text x="748" y="303" font-family="Consolas, monospace" font-size="14" font-weight="400" fill="#B4C5D4" >REAL-TIME EVENTS → DURABLE STATE</text>
